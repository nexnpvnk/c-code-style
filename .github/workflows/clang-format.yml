name: clang-format

# Gates pull requests (and pushes to main) on clang-format compliance using
# this repository's .clang-format rules. Combine with a branch protection
# rule that requires this check to pass — see the "Continuous Integration"
# section in CODING_RULES.md for the exact steps.

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  clang-format-check:
    name: Check clang-format compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Install LLVM 23 explicitly instead of relying on the runner's default
      # clang-format version.
      #
      # llvm.sh only sets up the repo and installs its own default package
      # set (clang/lldb/lld/clangd) — clang-format is a separate package in
      # the same repo and must be installed explicitly.
      - name: Install clang-format 23
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 23
          sudo apt-get install -y clang-format-23
          sudo ln -sf "$(command -v clang-format-23)" /usr/local/bin/clang-format
          clang-format --version

      - name: Check maintained reference templates
        run: scripts/check-format.sh --check template.c template.h
